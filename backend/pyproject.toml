[project]
name = "newsagent"
version = "0.1.0"
description = "基于证据的新闻事件研究 Agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "typer>=0.25,<1",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "trafilatura>=2,<3",
  "htmldate>=1.9,<2",
  "dateparser>=1.2,<2",
  "python-dotenv>=1,<2",
  # 评测：Open-TLS 官方使用的 tilse（AR-1/AR-2），其 ROUGE 重实现依赖 nltk 与 pyrouge 自带的停用词表
  "tilse==0.2.1",
  "nltk>=3.9,<4",
  "pyrouge==0.1.3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  # BrowseComp-Plus 固定语料：读取官方 parquet（BM25 检索用 SQLite FTS5）
  "pyarrow>=18",
]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "ruff>=0.11,<1", "pyright>=1.1.400,<2"]

[project.scripts]
newsagent = "newsagent.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsagent"]

[tool.uv]
# tilse 声明的 spacy / textacy / numba / pathlib2 只用于其文本处理模块，评测用到的 ROUGE 模块不需要，屏蔽以避免编译老版本
override-dependencies = [
  "spacy; sys_platform == 'never'",
  "textacy; sys_platform == 'never'",
  "numba; sys_platform == 'never'",
  "pathlib2; sys_platform == 'never'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 需要真实供应商密钥的测试"]
